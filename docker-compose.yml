services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: hirebridge
      POSTGRES_PASSWORD: hirebridge
      POSTGRES_DB: hirebridge
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hirebridge"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
