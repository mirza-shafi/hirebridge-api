name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: hirebridge
          POSTGRES_PASSWORD: hirebridge
          POSTGRES_DB: hirebridge_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hirebridge" --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://hirebridge:hirebridge@localhost:5432/hirebridge_test
      REDIS_URL: redis://localhost:6379/0
      CLERK_ISSUER: https://test.clerk.accounts.dev
      ENVIRONMENT: local
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with: { python-version: "3.12" }
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run mypy app
      - run: uv run alembic upgrade head
      - run: uv run pytest
